# HTTP → HTTPS：此前 80 端口没有本站 server 块，请求会落到宝塔默认站（wordpress）
server {
    listen 80;
    listen [::]:80;
    server_name mindpop.top www.mindpop.top;
    return 301 https://mindpop.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mindpop.top;
    ssl_certificate /www/server/panel/vhost/nginx/ssl/mindpop.top.pem;
    ssl_certificate_key /www/server/panel/vhost/nginx/ssl/mindpop.top.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # 应用在反向代理后仍生成 http:// 的绝对跳转（如 http://mindpop.top/home.html），
        # 浏览器跟随会掉到 80 端口撞上默认站，这里把 Location 改写回 https。
        proxy_redirect ~^http://[^/]+/(.*)$ https://mindpop.top/$1;
    }
}
