# www 子域：统一 301 到裸域，保证只有一份规范地址
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.mindpop.top;
  ssl_certificate /www/server/panel/vhost/nginx/ssl/www.mindpop.top.pem;
  ssl_certificate_key /www/server/panel/vhost/nginx/ssl/www.mindpop.top.key;
  return 301 https://mindpop.top$request_uri;
}
